name: Setup Rust
description: Installs the Rust toolchain pinned in .tool-versions

inputs:
  components:
    description: Comma-separated list of components to additionally install
    required: false
  targets:
    description: Comma-separated list of target triples to install for
    required: false

runs:
  using: "composite"
  steps:
    # .tool-versions is the one place the toolchain is named, so CI and a
    # developer's machine cannot drift apart.
    - id: toolchain
      shell: bash
      run: |
        version=$(awk '$1 == "rust" { print $2 }' .tool-versions)
        if [ -z "$version" ]; then
          echo "no rust entry in .tool-versions" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    # rustup is preinstalled on GitHub-hosted runners, so no third-party
    # action sits between CI and the toolchain.
    - shell: bash
      env:
        TOOLCHAIN: ${{ steps.toolchain.outputs.version }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        args=(--profile minimal --no-self-update)
        if [ -n "$COMPONENTS" ]; then args+=(--component "${COMPONENTS// /}"); fi
        if [ -n "$TARGETS" ]; then args+=(--target "${TARGETS// /}"); fi
        rustup toolchain install "$TOOLCHAIN" "${args[@]}"
        rustup default "$TOOLCHAIN"
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"
        rustc --version
