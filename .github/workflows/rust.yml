name: Rust

on:
  workflow_call:

permissions:
  contents: read

env:
  # Full debuginfo is most of what a dev build writes and links, and CI only
  # ever reads a backtrace out of it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build renderer
        run: pnpm vite build

      - name: Install Linux deps
        uses: ./.github/actions/linux-deps

      - name: Install Rust toolchain
        uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy

      # Saved from main only: a cache saved on a pull request is one no other
      # pull request can read.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Here rather than in lint.yml, because it reads the licence files out of
      # the crate sources and needs cargo to have fetched them.
      - name: Third-party notices
        run: pnpm notices --check

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: rustdoc
        working-directory: src-tauri
        # Doc-link lints only fire under rustdoc, so clippy never reaches them.
        run: cargo doc --no-deps --document-private-items

  test:
    name: Test
    runs-on: ubuntu-24.04
    # The hub a shared library publishes to. The tests that need one skip
    # without RADIODIODJ_TEST_HUB, which is how a local run behaves.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RADIODIODJ_TEST_HUB: postgresql://postgres:hub@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build renderer
        run: pnpm vite build

      - name: Install Linux deps
        uses: ./.github/actions/linux-deps

      - name: Install Rust toolchain
        uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
