name: Rust

on:
  workflow_call:

permissions:
  contents: read

env:
  # Full debuginfo is most of what a dev build writes and links, and CI only
  # ever reads a backtrace out of it.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build renderer
        run: pnpm vite build

      - name: Install Linux deps
        uses: ./.github/actions/linux-deps

      - name: Install Rust toolchain
        uses: ./.github/actions/rust
        with:
          components: rustfmt, clippy

      # Saved from main only: a cache saved on a pull request is one no other
      # pull request can read.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Here rather than in lint.yml, because it reads the licence files out of
      # the crate sources and needs cargo to have fetched them.
      - name: Third-party notices
        run: pnpm notices --check

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: rustdoc
        working-directory: src-tauri
        # Doc-link lints only fire under rustdoc, so clippy never reaches them.
        run: cargo doc --no-deps --document-private-items

  test:
    name: Test
    runs-on: ubuntu-24.04
    # The hub a shared library publishes to. The tests that need one skip
    # without RADIODIODJ_TEST_HUB, which is how a local run behaves.
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RADIODIODJ_TEST_HUB: postgresql://postgres:hub@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build renderer
        run: pnpm vite build

      - name: Install Linux deps
        uses: ./.github/actions/linux-deps

      - name: Install Rust toolchain
        uses: ./.github/actions/rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A second hub, with TLS under an authority made for this run: what a
      # database inside a cluster usually has. A service container cannot be
      # handed files made in a step, hence `docker run`.
      - name: Start a hub with TLS
        run: |
          set -euo pipefail
          certs="$RUNNER_TEMP/hub-certs"
          mkdir -p "$certs"
          cd "$certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout ca.key -out ca.crt -subj "/CN=Test Hub CA"
          openssl req -newkey rsa:2048 -nodes \
            -keyout server.key -out server.csr -subj "/CN=localhost"
          printf '%s\n' \
            'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            'basicConstraints=CA:FALSE' \
            'extendedKeyUsage=serverAuth' > ext.cnf
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
            -CAcreateserial -days 2 -out server.crt -extfile ext.cnf
          docker run -d --name hub-tls -p 5433:5432 \
            -e POSTGRES_PASSWORD=hub -v "$certs:/certs:ro" \
            postgres:17-alpine sh -c '
              cp /certs/server.crt /certs/server.key /var/lib/postgresql/ &&
              chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key &&
              chmod 600 /var/lib/postgresql/server.key &&
              exec docker-entrypoint.sh postgres -c ssl=on \
                -c ssl_cert_file=/var/lib/postgresql/server.crt \
                -c ssl_key_file=/var/lib/postgresql/server.key'
          # Over TCP: the entrypoint's first, temporary server listens on the
          # socket alone, and is not the one the tests reach.
          for _ in $(seq 60); do
            docker exec hub-tls pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          docker exec hub-tls pg_isready -h 127.0.0.1 -U postgres
          {
            echo "RADIODIODJ_TEST_HUB_TLS=postgresql://postgres:hub@localhost:5433/postgres"
            echo "RADIODIODJ_TEST_HUB_CA=$certs/ca.crt"
          } >> "$GITHUB_ENV"

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
