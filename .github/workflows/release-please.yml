name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      release_tag: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - name: Generate custom token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.CUSTOM_TOKEN_APP_ID }}
          private-key: ${{ secrets.CUSTOM_TOKEN_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          token: ${{ steps.token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos-arm64:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: macos-14
      target: aarch64-apple-darwin
      args: --target aarch64-apple-darwin
      artifact-name: bundle-macos-arm64
    secrets: inherit

  build-macos-x64:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: macos-14
      target: x86_64-apple-darwin
      args: --target x86_64-apple-darwin
      artifact-name: bundle-macos-x64
    secrets: inherit

  build-linux-x64:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      args: ""
      artifact-name: bundle-linux-x64
    secrets: inherit

  build-windows-x64:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      args: ""
      artifact-name: bundle-windows-x64
      # Flip to true once a Windows signing cert + secrets exist. See docs/signing.md.
      sign-windows: false
    secrets: inherit

  upload-release:
    needs:
      - release-please
      - build-macos-arm64
      - build-macos-x64
      - build-linux-x64
      - build-windows-x64
    # Runs once the builds finish whatever their outcome, so a platform that fails to
    # build does not hold back the bundles that did. The release itself is already
    # public by then: release-please publishes the tag before any build starts.
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: false

      # Publish the GPG public key so users can verify the signed Linux
      # AppImage. The key is public by definition; no-op if the var is unset.
      - name: Stage GPG public key
        if: vars.GPG_PUBLIC_KEY != ''
        shell: bash
        env:
          GPG_PUBLIC_KEY: ${{ vars.GPG_PUBLIC_KEY }}
        run: |
          printf '%s\n' "$GPG_PUBLIC_KEY" > radiodiodj-signing-key.asc

      - name: Upload bundles to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.release_tag }}
        shell: bash
        run: |
          shopt -s nullglob globstar
          files=(artifacts/**/*.dmg artifacts/**/*.app.tar.gz artifacts/**/*.AppImage artifacts/**/*.deb artifacts/**/*.rpm artifacts/**/*.msi artifacts/**/*.exe artifacts/**/*.nsis.zip radiodiodj-signing-key.asc)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bundle artifacts found" >&2
            find artifacts -type f >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Fail on incomplete release
        if: contains(needs.*.result, 'failure')
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Incomplete release"
            echo
            echo "Uploaded what built. These platforms are missing from the release:"
            echo
            jq -r 'to_entries[]
              | select(.key | startswith("build-"))
              | select(.value.result != "success")
              | "- \(.key): \(.value.result)"' <<<"$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::release is missing platform bundles"
          exit 1
