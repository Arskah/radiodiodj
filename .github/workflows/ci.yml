name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # The run on main is the one that saves the Rust caches every pull request
  # restores from.
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # A cancelled run saves no cache, so a run on main is left to finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  typecheck:
    uses: ./.github/workflows/typecheck.yml

  test:
    uses: ./.github/workflows/unit-test.yml

  rust:
    uses: ./.github/workflows/rust.yml

  site:
    uses: ./.github/workflows/site.yml

  build:
    uses: ./.github/workflows/build.yml
    with:
      platform: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      args: "--no-bundle"
      artifact-name: linux-binary

  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      build-artifact: linux-binary
