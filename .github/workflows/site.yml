name: Site

# Builds radiodiodj.org from site/. See docs/website.md.

on:
  workflow_call:
    inputs:
      upload:
        description: Upload the build as the GitHub Pages artifact, for a deploy job in the calling workflow
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  site:
    name: Site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - if: inputs.upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
          # For .well-known/security.txt.
          include-hidden-files: true
