name: E2E

on:
  workflow_call:
    inputs:
      build-artifact:
        description: Name of the bundle artifact uploaded by build.yml (must contain the raw `radiodiodj` binary)
        type: string
        required: true

permissions:
  contents: read

env:
  TAURI_DRIVER_VERSION: 2.0.6

jobs:
  e2e:
    name: E2E (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-1 \
            librsvg2-2 \
            libasound2-plugins \
            pulseaudio \
            pulseaudio-utils \
            webkit2gtk-driver \
            xvfb

      - name: Start PulseAudio with null sink
        run: |
          # Bridge ALSA → PulseAudio so rodio/cpal's ALSA backend finds a sink
          mkdir -p ~/.config/pulse
          sudo tee /etc/asound.conf > /dev/null <<'EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          EOF
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          pactl load-module module-null-sink sink_name=dummy sink_properties=device.description=Dummy
          pactl set-default-sink dummy
          pactl list short sinks

      - name: Install Rust toolchain
        uses: ./.github/actions/rust

      - name: Install tauri-driver
        run: cargo install tauri-driver --version ${{ env.TAURI_DRIVER_VERSION }} --locked

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build-artifact }}
          path: build-artifact

      - name: Place binary at expected path
        run: |
          if [ ! -f build-artifact/radiodiodj ]; then
            echo "radiodiodj binary missing from build artifact"
            ls -la build-artifact
            exit 1
          fi
          mkdir -p src-tauri/target/release
          cp build-artifact/radiodiodj src-tauri/target/release/radiodiodj
          chmod +x src-tauri/target/release/radiodiodj

      # TEMP: localise the 30 s session start. Remove before merge.
      - name: Diagnose session start
        continue-on-error: true
        env:
          E2E_BINARY: release
          RUST_LOG: debug
          E2E_WORKERS: "1"
        run: |
          WebKitWebDriver --version || true
          echo "DBUS_SESSION_BUS_ADDRESS=${DBUS_SESSION_BUS_ADDRESS:-unset} XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-unset}"
          command -v dbus-run-session dbus-launch || true
          run_variant() {
            name="$1"; shift
            echo "::group::variant $name"
            rm -rf /tmp/radiodiodj-e2e-xdg-*
            ( sleep 15; echo "--- ps at +15s"; ps -eo pid,ppid,etimes,stat,args --forest | grep -iE "radiodiodj|WebKit|tauri-driver|dbus|at-spi|portal" | grep -v grep | cut -c1-200 ) &
            start=$(date +%s)
            "$@" pnpm e2e --spec e2e/specs/smoke.spec.ts > /tmp/diag.out 2>&1 || tail -30 /tmp/diag.out
            echo "variant $name took $(( $(date +%s) - start ))s"
            wait
            echo "--- wdio"
            grep -hE "POST\] .*/session$|getWindowHandle\(\)|DELETE\]|Run worker|ERROR" e2e-results/*.log | cut -c1-200 || true
            echo "--- app log"
            for f in /tmp/radiodiodj-e2e-xdg-*/com.radiodiodj/logs/*.log; do echo "## $f"; head -12 "$f" | cut -c1-220; done || true
            echo "--- driver log"
            tail -20 e2e-results/tauri-driver-*.log | cut -c1-220 || true
            echo "::endgroup::"
          }
          run_variant baseline xvfb-run -a
          run_variant classic env E2E_CLASSIC=1 xvfb-run -a
          run_variant no-a11y env GTK_A11Y=none NO_AT_BRIDGE=1 xvfb-run -a
          run_variant dbus-session dbus-run-session -- xvfb-run -a
          run_variant no-compositing env WEBKIT_DISABLE_COMPOSITING_MODE=1 WEBKIT_DISABLE_DMABUF_RENDERER=1 xvfb-run -a

      - name: Run e2e
        env:
          E2E_BINARY: release
          RUST_LOG: debug
          RUST_BACKTRACE: "1"
        run: xvfb-run -a pnpm e2e

      - name: Upload failure artifacts
        if: always() # TEMP: was failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: e2e-results/**
          if-no-files-found: ignore
          retention-days: 7
