name: E2E

on:
  workflow_call:
    inputs:
      build-artifact:
        description: Name of the bundle artifact uploaded by build.yml (must contain the raw `radiodiodj` binary)
        type: string
        required: true

permissions:
  contents: read

env:
  TAURI_DRIVER_VERSION: 2.0.6

jobs:
  e2e:
    name: E2E (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-1 \
            librsvg2-2 \
            libasound2-plugins \
            pulseaudio \
            pulseaudio-utils \
            webkit2gtk-driver \
            xvfb

      - name: Start PulseAudio with null sink
        run: |
          # Bridge ALSA → PulseAudio so rodio/cpal's ALSA backend finds a sink
          mkdir -p ~/.config/pulse
          sudo tee /etc/asound.conf > /dev/null <<'EOF'
          pcm.!default {
            type pulse
          }
          ctl.!default {
            type pulse
          }
          EOF
          pulseaudio --start --exit-idle-time=-1 --log-target=stderr
          pactl load-module module-null-sink sink_name=dummy sink_properties=device.description=Dummy
          pactl set-default-sink dummy
          pactl list short sinks

      - name: Install Rust toolchain
        uses: ./.github/actions/rust

      - name: Install tauri-driver
        run: cargo install tauri-driver --version ${{ env.TAURI_DRIVER_VERSION }} --locked

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.build-artifact }}
          path: build-artifact

      - name: Place binary at expected path
        run: |
          if [ ! -f build-artifact/radiodiodj ]; then
            echo "radiodiodj binary missing from build artifact"
            ls -la build-artifact
            exit 1
          fi
          mkdir -p src-tauri/target/release
          cp build-artifact/radiodiodj src-tauri/target/release/radiodiodj
          chmod +x src-tauri/target/release/radiodiodj

      - name: Run e2e
        env:
          E2E_BINARY: release
          RUST_LOG: debug
          RUST_BACKTRACE: "1"
        run: xvfb-run -a pnpm e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: e2e-results/**
          if-no-files-found: ignore
          retention-days: 7
