[package]
name = "radiodiodj"
version = "0.22.0"
description = "Radio station music player"
authors = ["Aarni Halinen"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.95"

[lib]
name = "radiodiodj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Doc-comment hygiene, so the Rust side of the comment convention is enforced
# rather than remembered. CI runs clippy with `-D warnings`, and the `cargo doc`
# step next to it is what reaches the rustdoc group. See AGENTS.md → Comments.
[lints.rust]
# No doc group exists here; `missing_docs` is the whole of it.
missing_docs = "warn"

[lints.clippy]
# `doc_markdown` is named rather than taken with its group: it lives in
# `clippy::pedantic`, which has no doc-only subgroup and whose other 80-odd
# warnings here are about casts and formatting, not comments.
doc_markdown = "warn"

# Taken whole, so a doc lint a later toolchain adds to the group arrives already
# enabled. `priority` lets a specific lint below override the group if one ever
# has to be loosened; nothing needs it today.
[lints.rustdoc]
all = { level = "deny", priority = -1 }

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-log = "=2.9.2"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-window-state = "=2.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "flac", "id3v2", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
parking_lot = "=0.12.5"
anyhow = "=1.0.104"
walkdir = "=2.5.0"
lofty = "=0.25.4"
base64 = "=0.23.1"
tokio = { version = "=1.53.1", features = ["rt", "sync", "time"] }
log = "=0.4.34"
rodio = { version = "=0.21.1", features = ["symphonia-aac", "symphonia-isomp4"] }
cpal = "=0.16.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"
chrono = { version = "=0.4.45", features = ["serde"] }
strum = { version = "=0.28.0", features = ["derive"] }
argon2 = "=0.6.0"
ebur128 = "=0.1.10"

[dev-dependencies]
tempfile = "=3.27.0"
wiremock = "=0.6.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Password hashing is unbearably slow unoptimised; keep debug builds and tests quick.
[profile.dev.package.argon2]
opt-level = 3
