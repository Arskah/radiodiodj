[package]
name = "radiodiodj"
version = "0.21.2"
description = "Radio station music player"
authors = ["Aarni Halinen"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.95"

[lib]
name = "radiodiodj_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.3"
tauri-plugin-log = "=2.9.1"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-window-state = "=2.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
parking_lot = "=0.12.5"
anyhow = "=1.0.104"
walkdir = "=2.5.0"
lofty = "=0.25.2"
base64 = "=0.23.1"
tokio = { version = "=1.53.1", features = ["rt", "sync", "time"] }
log = "=0.4.34"
rodio = { version = "=0.21.1", features = ["symphonia-aac", "symphonia-isomp4"] }
cpal = "=0.16.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
hmac = "=0.13.0"
sha2 = "=0.11.0"
chrono = { version = "=0.4.45", features = ["serde"] }
strum = { version = "=0.28.0", features = ["derive"] }
argon2 = "=0.6.0"
ebur128 = "=0.1.10"

[dev-dependencies]
tempfile = "=3.27.0"
wiremock = "=0.6.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Password hashing is unbearably slow unoptimised; keep debug builds and tests quick.
[profile.dev.package.argon2]
opt-level = 3
